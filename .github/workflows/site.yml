name: Site

# Publica a versao web (para iPhone e navegador) a cada push na main.
# Dois destinos, cada um liga sozinho quando estiver configurado:
# - GitHub Pages: so em repositorio publico (no plano gratuito o Pages nao serve repositorio
#   privado). Em Settings > Pages, "Source" precisa estar em "GitHub Actions".
# - Cloudflare Pages: quando existirem os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID.
#   Funciona com o repositorio privado.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        if: ${{ !github.event.repository.private }}
        with:
          path: dist

      - name: Publica no Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx --yes wrangler@4 pages project create negocio-proprio --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name=negocio-proprio --branch=main

  pages:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
