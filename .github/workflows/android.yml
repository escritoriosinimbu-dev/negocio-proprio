name: APK Android

# Gera o APK a cada push na main, em todo pull request e quando uma tag v* e criada.
# O APK fica nos "Artifacts" da execucao; nas tags, vira tambem uma Release para baixar no celular.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# So o job de Release escreve no repositorio.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Confere se a tag bate com a versao do package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$VERSAO" ]; then
            echo "::error::A tag ${GITHUB_REF_NAME} nao bate com o package.json (${VERSAO}). Use 'npm version patch' para subir os dois juntos."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # O runner ubuntu-latest ja traz o Android SDK em $ANDROID_HOME com as licencas aceitas, e o
      # Gradle baixa sozinho a plataforma que faltar. (A action setup-android@v3 quebrava aqui:
      # tentava instalar o pacote "tools", que nao existe mais no repositorio do SDK.)

      - name: Instala dependencias e testa o motor
        run: |
          npm ci
          npm test

      - name: Build web e sincroniza com o projeto Android
        run: npm run android:sync

      - name: Compila o APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renomeia o APK
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/debug/app-debug.apk "negocio-proprio-${VERSAO}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: negocio-proprio-apk
          path: negocio-proprio-*.apk
          retention-days: 7

  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: negocio-proprio-apk

      - uses: softprops/action-gh-release@v3
        with:
          files: negocio-proprio-*.apk
          generate_release_notes: true
